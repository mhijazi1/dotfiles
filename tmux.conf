# =============================================================================
# TMUX Configuration
# =============================================================================
# A clean, standard tmux configuration using TPM for plugin management
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------

# Terminal & Colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Faster command sequences (reduce escape time)
set -s escape-time 10

# Increase repeat timeout
set -sg repeat-time 600

# Enable focus events (for vim/neovim integration)
set -s focus-events on

# Increase scrollback buffer
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Vi mode
set -g status-keys vi
set -g mode-keys vi

# -----------------------------------------------------------------------------
# Prefix Key
# -----------------------------------------------------------------------------

# Use HOME as prefix (uncomment C-a if you prefer that)
unbind C-b
set -g prefix Home
bind Home send-prefix

# Alternative: Use C-a as prefix (GNU Screen style)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# -----------------------------------------------------------------------------
# Display Settings
# -----------------------------------------------------------------------------

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Automatically rename windows
setw -g automatic-rename on

# Set terminal title
set -g set-titles on
set -g set-titles-string "#S:#I:#W - #{pane_current_command}"

# Slightly longer pane indicators display time
set -g display-panes-time 800

# Slightly longer status messages display time
set -g display-time 1000

# Redraw status line every 10 seconds
set -g status-interval 10

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off

# -----------------------------------------------------------------------------
# Key Bindings - General
# -----------------------------------------------------------------------------

# Reload configuration
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Edit configuration
bind e new-window -n "tmux.conf" "#{EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display 'Config reloaded!'"

# Clear screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

# -----------------------------------------------------------------------------
# Key Bindings - Sessions
# -----------------------------------------------------------------------------

# Create new session
bind C-c new-session

# Find session
bind C-f command-prompt -p "find-session:" "switch-client -t %%"

# Switch to last session
bind BTab switch-client -l

# Prompt for session name when creating
bind S command-prompt -p "new-session:" "new-session -s '%%'"

# -----------------------------------------------------------------------------
# Key Bindings - Windows
# -----------------------------------------------------------------------------

# Split windows (more intuitive keys)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

# New window retains current path
bind c new-window -c "#{pane_current_path}"

# Window navigation
unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# -----------------------------------------------------------------------------
# Key Bindings - Panes
# -----------------------------------------------------------------------------

# Pane navigation (vim style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing (vim style, uppercase)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Maximize pane (toggle zoom)
bind + resize-pane -Z
bind z resize-pane -Z

# -----------------------------------------------------------------------------
# Key Bindings - Copy Mode
# -----------------------------------------------------------------------------

# Enter copy mode
bind Enter copy-mode

# Vi-style copy mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# -----------------------------------------------------------------------------
# Key Bindings - Buffers
# -----------------------------------------------------------------------------

# Buffer management
bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

# -----------------------------------------------------------------------------
# Clipboard Integration (Linux - requires xclip or xsel)
# -----------------------------------------------------------------------------

# Copy to system clipboard
if-shell "command -v xclip" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}

if-shell "command -v xsel" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel --clipboard --input"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel --clipboard --input"
}

# Wayland clipboard support
if-shell "command -v wl-copy" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
}

# -----------------------------------------------------------------------------
# Theme - Catppuccin
# -----------------------------------------------------------------------------

# Status bar position
set -g status-position bottom
set -g status-justify left

# Catppuccin theme configuration (set before loading plugin)
set -g @catppuccin_flavor "macchiato"

# Status bar modules
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"

# Window status
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_text "#W"

# Status line
set -g status-left-length 100
set -g status-right-length 100

# =============================================================================
# Plugins (TPM - Tmux Plugin Manager)
# =============================================================================
# Install TPM if not present:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Plugin commands:
#   prefix + I     - Install plugins
#   prefix + U     - Update plugins
#   prefix + alt-u - Uninstall plugins not in list
# =============================================================================

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# -----------------------------------------------------------------------------
# Plugin Configuration
# -----------------------------------------------------------------------------

# tmux-resurrect: Save and restore sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: Automatic save/restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# tmux-yank: Better clipboard support
set -g @yank_selection_mouse 'clipboard'

# =============================================================================
# Initialize TPM (keep this line at the very bottom)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
